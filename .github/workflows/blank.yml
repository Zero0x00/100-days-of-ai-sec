name: TruffleHog Secret Scan

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  trufflehog:
    name: Scan for Secrets with TruffleHog
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Get full git history for scanning

      - name: Run TruffleHog OSS scanner
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
          extra_args: --debug #--only-verified

      - name: Run TruffleHog
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            ghcr.io/trufflesecurity/trufflehog:latest \
            git file:///repo \
            --json > trufflehog-results.json || true

      - name: Convert NDJSON to valid JSON array
        run: |
          echo "[" > formatted.json
          sed '$!s/$/,/' trufflehog-results.json >> formatted.json
          echo "]" >> formatted.json

      - name: Upload TruffleHog results
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-results
          path: |
            trufflehog-results.json
            formatted.json

      - name: Fail if secrets detected
        if: steps.trufflehog.outcome == 'failure'
        run: exit 1
